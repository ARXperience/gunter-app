<script>
(function() {
  const container = document.getElementById('threejs-iso-core');
  if (!container) return;

  const width = container.clientWidth || 360;
  const height = container.clientHeight || 360;

  const scene = new THREE.Scene();
  
  // Isometric / Axonometric tilt camera setup
  const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
  camera.position.set(0, 13, 23);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setSize(width, height);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  container.appendChild(renderer.domElement);

  // Group to apply global Isometric tilt (Pitch & Yaw)
  const isoMasterGroup = new THREE.Group();
  isoMasterGroup.rotation.x = 0.52; // ~30 deg isometric slant
  isoMasterGroup.rotation.y = -0.42; // ~-24 deg isometric yaw
  scene.add(isoMasterGroup);

  // Particle Counts for Penguin & Rings
  const PENGUIN_COUNT = 2400;
  const ISO_RINGS_COUNT = 3200;
  const TOTAL_COUNT = PENGUIN_COUNT + ISO_RINGS_COUNT;

  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(TOTAL_COUNT * 3);
  const basePositions = new Float32Array(TOTAL_COUNT * 3);
  const velocities = new Float32Array(TOTAL_COUNT * 3);
  const colors = new Float32Array(TOTAL_COUNT * 3);
  const baseColors = new Float32Array(TOTAL_COUNT * 3);
  const sizes = new Float32Array(TOTAL_COUNT);
  const baseSizes = new Float32Array(TOTAL_COUNT);
  const pMeta = new Float32Array(TOTAL_COUNT * 4); // [isRing, radius/level, speed, angle/phase]

  const cyan = new THREE.Color(0x38bdf8);
  const deepCyan = new THREE.Color(0x0284c7);
  const brightTurquoise = new THREE.Color(0x2dd4bf);
  const neonElectric = new THREE.Color(0x67e8f9);
  const coreWhite = new THREE.Color(0xffffff);

  let idx = 0;

  // 1. PENGUIN NUCLEUS (Quantum Penguin at core center)
  for (let i = 0; i < PENGUIN_COUNT; i++) {
    let x = 0, y = 0, z = 0;
    let part = Math.random();
    let c = coreWhite;

    if (part < 0.44) {
      // Torso / Core Heart
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const rx = 2.1 * Math.sin(phi) * Math.cos(theta);
      const ry = 3.5 * Math.cos(phi);
      const rz = 1.6 * Math.sin(phi) * Math.sin(theta);
      x = rx * (0.85 + 0.15 * Math.random());
      y = ry - 0.2;
      z = rz * (0.85 + 0.15 * Math.random());
      c = Math.random() > 0.4 ? cyan : coreWhite;
    } else if (part < 0.68) {
      // Head & Neural Crown
      const u = Math.random();
      const v = Math.random();
      const theta = u * 2.0 * Math.PI;
      const phi = Math.acos(2.0 * v - 1.0);
      const r = 1.5 * (0.88 + 0.12 * Math.random());
      x = r * Math.sin(phi) * Math.cos(theta) * 0.92;
      y = 3.3 + r * Math.cos(phi) * 0.95;
      z = r * Math.sin(phi) * Math.sin(theta) * 0.88;
      c = Math.random() > 0.5 ? coreWhite : neonElectric;
    } else if (part < 0.88) {
      // Kinetic Wings / Flippers
      const side = Math.random() > 0.5 ? 1 : -1;
      const t = Math.random();
      x = side * (1.9 + t * 1.5 + (Math.random() - 0.5) * 0.3);
      y = 1.9 - t * 3.8;
      z = (Math.random() - 0.5) * 0.5;
      c = brightTurquoise;
    } else if (part < 0.94) {
      // Cyber Visor / Beak
      const t = Math.random();
      x = (Math.random() - 0.5) * 0.4 * (1 - t);
      y = 3.2 - t * 0.45;
      z = 1.35 + t * 1.5;
      c = coreWhite;
    } else {
      // Quantum Base Anchors / Feet
      const side = Math.random() > 0.5 ? 1 : -1;
      x = side * (1.0 + Math.random() * 0.7);
      y = -3.8 + (Math.random() - 0.5) * 0.4;
      z = (Math.random() - 0.5) * 1.0;
      c = deepCyan;
    }

    positions[idx * 3] = x;
    positions[idx * 3 + 1] = y;
    positions[idx * 3 + 2] = z;
    basePositions[idx * 3] = x;
    basePositions[idx * 3 + 1] = y;
    basePositions[idx * 3 + 2] = z;

    colors[idx * 3] = c.r;
    colors[idx * 3 + 1] = c.g;
    colors[idx * 3 + 2] = c.b;
    baseColors[idx * 3] = c.r;
    baseColors[idx * 3 + 1] = c.g;
    baseColors[idx * 3 + 2] = c.b;

    sizes[idx] = 1.6 + Math.random() * 2.0;
    baseSizes[idx] = sizes[idx];

    pMeta[idx * 4] = 0.0; // 0 = Penguin
    pMeta[idx * 4 + 1] = 0.0;
    pMeta[idx * 4 + 2] = 0.0;
    pMeta[idx * 4 + 3] = 0.0;
    idx++;
  }

  // 2. ISOMETRIC & HIGH-TECH ORBITAL RINGS & AUREOLAS
  const RING_SPECS = [
    { radius: 3.8, yLevel: 1.2, count: 420, speed: 0.65, col: coreWhite, hasTicks: true, planeTiltX: 0.1, planeTiltZ: -0.05 },
    { radius: 5.6, yLevel: 0.0, count: 680, speed: -0.45, col: neonElectric, hasTicks: true, planeTiltX: -0.15, planeTiltZ: 0.12 },
    { radius: 7.8, yLevel: -1.0, count: 780, speed: 0.38, col: cyan, hasTicks: true, planeTiltX: 0.18, planeTiltZ: -0.2 },
    { radius: 9.8, yLevel: 0.6, count: 680, speed: -0.28, col: brightTurquoise, hasTicks: false, planeTiltX: -0.08, planeTiltZ: 0.15 },
    { radius: 12.0, yLevel: -0.5, count: 640, speed: 0.22, col: deepCyan, hasTicks: true, planeTiltX: 0.05, planeTiltZ: -0.08 }
  ];

  RING_SPECS.forEach((ring) => {
    for (let k = 0; k < ring.count && idx < TOTAL_COUNT; k++) {
      const angle = (k / ring.count) * Math.PI * 2;
      const isTick = ring.hasTicks && (k % 6 === 0);
      const tickOffset = isTick ? (Math.random() - 0.5) * 0.4 : 0;
      const rVal = ring.radius + tickOffset + (Math.random() - 0.5) * 0.2;
      
      let rx = rVal * Math.cos(angle);
      let rz = rVal * Math.sin(angle);
      let ry = ring.yLevel + (Math.random() - 0.5) * 0.2;

      // Isometric plane tilt calculations
      const cosX = Math.cos(ring.planeTiltX);
      const sinX = Math.sin(ring.planeTiltX);
      const y1 = ry * cosX - rz * sinX;
      const z1 = ry * sinX + rz * cosX;

      const cosZ = Math.cos(ring.planeTiltZ);
      const sinZ = Math.sin(ring.planeTiltZ);
      const x2 = rx * cosZ - y1 * sinZ;
      const y2 = rx * sinZ + y1 * cosZ;

      positions[idx * 3] = x2;
      positions[idx * 3 + 1] = y2;
      positions[idx * 3 + 2] = z1;
      basePositions[idx * 3] = x2;
      basePositions[idx * 3 + 1] = y2;
      basePositions[idx * 3 + 2] = z1;

      const c = isTick ? coreWhite : ring.col;
      colors[idx * 3] = c.r;
      colors[idx * 3 + 1] = c.g;
      colors[idx * 3 + 2] = c.b;
      baseColors[idx * 3] = c.r;
      baseColors[idx * 3 + 1] = c.g;
      baseColors[idx * 3 + 2] = c.b;

      sizes[idx] = isTick ? 3.8 : (1.8 + Math.random() * 1.5);
      baseSizes[idx] = sizes[idx];

      pMeta[idx * 4] = 1.0; // 1 = Ring particle
      pMeta[idx * 4 + 1] = ring.radius;
      pMeta[idx * 4 + 2] = ring.speed;
      pMeta[idx * 4 + 3] = angle;
      idx++;
    }
  });

  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

  // Circular glow radial texture
  const canvasTexture = document.createElement('canvas');
  canvasTexture.width = 64;
  canvasTexture.height = 64;
  const ctx = canvasTexture.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.25, 'rgba(103, 232, 249, 0.95)');
  gradient.addColorStop(0.65, 'rgba(14, 165, 233, 0.35)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);

  const pointTexture = new THREE.CanvasTexture(canvasTexture);

  const material = new THREE.PointsMaterial({
    size: 0.36,
    vertexColors: true,
    map: pointTexture,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });

  const particleSystem = new THREE.Points(geometry, material);
  isoMasterGroup.add(particleSystem);

  // Mouse & Touch Tracking for interactive acceleration & glow
  let mouseX = 0, mouseY = 0;
  let targetMouseX = 0, targetMouseY = 0;
  let isHovered = false;
  let hoverIntensity = 0;

  function updatePointer(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    targetMouseX = ((clientX - cx) / (rect.width / 2)) * 14.0;
    targetMouseY = -((clientY - cy) / (rect.height / 2)) * 12.0;
    isHovered = true;
  }

  const vPort = document.getElementById('hologram-viewport') || window;
  vPort.addEventListener('mousemove', (e) => updatePointer(e.clientX, e.clientY));
  vPort.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  vPort.addEventListener('touchstart', (e) => {
    if (e.touches.length > 0) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  vPort.addEventListener('touchend', () => { isHovered = false; });
  vPort.addEventListener('mouseleave', () => { isHovered = false; });

  function onWindowResize() {
    const w = container.clientWidth || 360;
    const h = container.clientHeight || 360;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', onWindowResize);

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    // Smooth lerp pointer
    mouseX += (targetMouseX - mouseX) * 0.08;
    mouseY += (targetMouseY - mouseY) * 0.08;

    const targetHover = isHovered ? 1.0 : 0.0;
    hoverIntensity += (targetHover - hoverIntensity) * 0.06;

    // Isometric breathing orientation
    isoMasterGroup.rotation.y = -0.42 + Math.sin(elapsedTime * 0.3) * 0.05 + mouseX * 0.02;
    isoMasterGroup.rotation.x = 0.52 + Math.cos(elapsedTime * 0.25) * 0.03 - mouseY * 0.02;

    // Rings spin up to 4.5x faster and flare into electric cyan and pure white
    const speedMultiplier = 1.0 + hoverIntensity * 4.2;

    const posAttr = geometry.attributes.position;
    const colAttr = geometry.attributes.color;
    const szAttr = geometry.attributes.size;
    const pArr = posAttr.array;
    const cArr = colAttr.array;
    const sArr = szAttr.array;

    for (let i = 0; i < idx; i++) {
      const i3 = i * 3;
      const i4 = i * 4;
      const isRing = pMeta[i4];
      const bx = basePositions[i3];
      const by = basePositions[i3 + 1];
      const bz = basePositions[i3 + 2];

      if (isRing > 0.5) {
        // High-tech Isometric Orbital Ring: Rotates rapidly around Y
        const baseSpeed = pMeta[i4 + 2];
        const currentSpeed = baseSpeed * speedMultiplier;
        const currentAngle = pMeta[i4 + 3] + elapsedTime * currentSpeed;

        const cosA = Math.cos(currentAngle);
        const sinA = Math.sin(currentAngle);

        const rx = bx * cosA - bz * sinA;
        const rz = bx * sinA + bz * cosA;

        // Subtle tech pulsation
        const pulse = 1.0 + 0.02 * Math.sin(elapsedTime * 4.0 + i);
        pArr[i3] = rx * pulse;
        pArr[i3 + 1] = by * pulse;
        pArr[i3 + 2] = rz * pulse;

        // LIGHT UP ON TOUCH: Interpolate towards intense radiant white-cyan
        const rNorm = baseColors[i3];
        const gNorm = baseColors[i3 + 1];
        const bNorm = baseColors[i3 + 2];

        // Luminescence boost
        cArr[i3] = THREE.MathUtils.lerp(rNorm, 1.0, hoverIntensity * 0.85);
        cArr[i3 + 1] = THREE.MathUtils.lerp(gNorm, 1.0, hoverIntensity * 0.85);
        cArr[i3 + 2] = THREE.MathUtils.lerp(bNorm, 1.0, hoverIntensity * 0.65);

        // Particle size expands when illuminated
        sArr[i] = baseSizes[i] * (1.0 + hoverIntensity * 0.8);
      } else {
        // PENGUIN NUCLEUS: Calm baseline center, bursts & disperses on touch/proximity
        const px = pArr[i3];
        const py = pArr[i3 + 1];
        const pz = pArr[i3 + 2];

        const dx = px - mouseX;
        const dy = py - mouseY;
        const distSq = dx * dx + dy * dy;
        const repelRadius = 6.4;

        if (distSq < repelRadius * repelRadius && hoverIntensity > 0.05) {
          const dist = Math.sqrt(distSq) + 0.001;
          const force = (1.0 - dist / repelRadius) * 3.6 * hoverIntensity;
          velocities[i3] += (dx / dist) * force * 0.5 + (Math.random() - 0.5) * 0.2;
          velocities[i3 + 1] += (dy / dist) * force * 0.5 + (Math.random() - 0.5) * 0.2;
          velocities[i3 + 2] += (Math.random() - 0.5) * force * 0.95;
        }

        // Return to home position (elastic nucleus memory)
        velocities[i3] += (bx - px) * 0.07;
        velocities[i3 + 1] += (by - py) * 0.07;
        velocities[i3 + 2] += (bz - pz) * 0.07;

        velocities[i3] *= 0.84;
        velocities[i3 + 1] *= 0.84;
        velocities[i3 + 2] *= 0.84;

        pArr[i3] += velocities[i3];
        pArr[i3 + 1] += velocities[i3 + 1];
        pArr[i3 + 2] += velocities[i3 + 2];

        // Core nucleus radiant intensity boost
        cArr[i3] = THREE.MathUtils.lerp(baseColors[i3], 1.0, hoverIntensity * 0.6);
        cArr[i3 + 1] = THREE.MathUtils.lerp(baseColors[i3 + 1], 1.0, hoverIntensity * 0.6);
        cArr[i3 + 2] = THREE.MathUtils.lerp(baseColors[i3 + 2], 1.0, hoverIntensity * 0.5);
        sArr[i] = baseSizes[i] * (1.0 + hoverIntensity * 0.4);
      }
    }

    posAttr.needsUpdate = true;
    colAttr.needsUpdate = true;
    szAttr.needsUpdate = true;

    renderer.render(scene, camera);
  }

  animate();
})();
</script>
</body></html>
