name: Mobile hosts

on:
  push:
    paths:
      - "gunter-mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "gunter-mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android isolated preview (not a client release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Verify APK report safety checks
        run: node --test gunter-mobile/scripts/test-apk-report.cjs
      - name: Test, lint and compile isolated preview APK
        env:
          GUNTER_WEB_ORIGIN: ${{ vars.GUNTER_WEB_ORIGIN }}
        run: gradle -p gunter-mobile/android --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Record preview APK checksum and build metadata
        run: node gunter-mobile/scripts/report-android-apk.cjs debug
      - name: Upload installable preview (debug signed, not for customers)
        uses: actions/upload-artifact@v7
        with:
          name: gunter-android-preview-apk
          path: |
            gunter-mobile/android/app/build/outputs/apk/debug/*.apk
            gunter-mobile/reports/android-debug-apk.json
            gunter-mobile/android/app/build/reports/tests/testDebugUnitTest/
            gunter-mobile/android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: gunter-mobile/ios
        run: xcodegen generate
      - name: Compile simulator app without signing
        working-directory: gunter-mobile/ios
        run: >-
          xcodebuild -project GunterMobile.xcodeproj -scheme GunterMobile
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build/DerivedData build
      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v7
        with:
          name: gunter-ios-simulator-build
          path: gunter-mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/GunterMobile.app
          if-no-files-found: error
          retention-days: 7
