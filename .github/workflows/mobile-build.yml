name: Mobile hosts

on:
  push:
    paths:
      - "gunter-mobile/**"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "gunter-mobile/**"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
      - name: Compile debug APK
        run: gradle -p gunter-mobile/android :app:assembleDebug
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v7
        with:
          name: gunter-android-debug-apk
          path: gunter-mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: gunter-mobile/ios
        run: xcodegen generate
      - name: Compile simulator app without signing
        working-directory: gunter-mobile/ios
        run: >-
          xcodebuild -project GunterMobile.xcodeproj -scheme GunterMobile
          -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO
          -derivedDataPath build/DerivedData build
      - name: Upload iOS simulator build
        uses: actions/upload-artifact@v7
        with:
          name: gunter-ios-simulator-build
          path: gunter-mobile/ios/build/DerivedData/Build/Products/Debug-iphonesimulator/GunterMobile.app
          if-no-files-found: error
          retention-days: 7
