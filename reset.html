<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gunter — Actualizar app</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0d1220; color: #eef1f8;
               display: grid; place-items: center; height: 100vh; margin: 0; text-align: center; padding: 24px; }
        .box { max-width: 420px; }
        .big { font-size: 52px; margin-bottom: 14px; }
        h1 { font-size: 22px; margin: 0 0 10px; }
        p { color: #8a93a8; font-size: 14.5px; line-height: 1.6; }
        #s { color: #6fe3b0; font-weight: 700; margin-top: 18px; min-height: 24px; }
    </style>
</head>
<body>
    <div class="box">
        <div class="big">🐧🧹</div>
        <h1>Actualizando Gunter</h1>
        <p>Eliminando versiones viejas cacheadas del navegador.<br>
           Tus datos NO se tocan — solo se limpia el cache de páginas.</p>
        <div id="s">Trabajando…</div>
    </div>
    <script>
        (async () => {
            const s = document.getElementById('s');
            try {
                let sws = 0, cs = 0;
                if ('serviceWorker' in navigator) {
                    const regs = await navigator.serviceWorker.getRegistrations();
                    for (const r of regs) { await r.unregister(); sws++; }
                }
                if ('caches' in window) {
                    const keys = await caches.keys();
                    for (const k of keys) { await caches.delete(k); cs++; }
                }
                s.textContent = `Listo ✓ (${sws} service worker, ${cs} caches eliminados). Entrando…`;
            } catch (e) {
                s.textContent = 'Hecho con avisos: ' + e.message;
            }
            setTimeout(() => location.replace('/login.html'), 1800);
        })();
    </script>
</body>
</html>
